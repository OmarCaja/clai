[project]
name = "clai"
version = "1.1.1"
description = "An intelligent command-line assistant built with LangChain agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Omar Caja", email = "omar.caja@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.5",
    "langchain-core>=1.6.10",
    "langchain-google-genai>=4.4.1",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
clai = "clai.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff.lint]
# E/W/F: pycodestyle and pyflakes; I: sorted imports; UP: modern syntax;
# B: likely bugs; SIM/C4/RET: simpler code; N: naming; PT: pytest style;
# PTH: pathlib over os.path; BLE: no silent `except Exception`; RUF: ruff's own;
# D: docstrings.
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "RET", "N", "PT", "PTH", "BLE", "RUF", "D"
]
# D105/D107: magic methods and __init__ are documented by their class docstring.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names say what they check; docstrings would repeat them.
"tests/**" = ["D"]

[tool.mypy]
strict = true
