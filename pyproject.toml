[project]
name = "clai"
version = "0.1.0"
description = "An intelligent command-line assistant built with LangChain agents"
readme = "README.md"
authors = [
    { name = "Omar Caja", email = "omar.caja@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.5",
    "langchain-core>=1.6.10",
    "langchain-google-genai>=4.4.1",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
]

[project.scripts]
clai = "clai.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
